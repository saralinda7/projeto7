<!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Usuário</title>
</head>
<body>

<header>
        <h1>Cadastro de Usuário</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Página Principal</a></li>
            <li><a href="#">Sobre Mim</a></li>
            <li><a href="#">Meus Projetos</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <section>
        <h2>Formulário de Cadastro</h2>
        
        <form action="#" method="POST">
            <p>
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha" required>
            </p>

            <p>
                <label for="genero">Gênero:</label><br>
                <select id="genero" name="genero">
                    <option value="">Selecione...</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                    <option value="prefiro-nao-dizer">Prefiro não dizer</option>
                </select>
            </p>

            <p>
                <label>Interesses:</label><br>
                <input type="checkbox" id="programacao" name="interesses" value="programacao">
                <label for="programacao">Programação</label><br>
                
                <input type="checkbox" id="design" name="interesses" value="design">
                <label for="design">Design</label><br>
                
                <input type="checkbox" id="musica" name="interesses" value="musica">
                <label for="musica">Música</label>
            </p>

            <p>
                <label for="biografia">Biografia:</label><br>
                <textarea id="biografia" name="biografia" rows="5" cols="40"></textarea>
            </p>

              <p>
                <input type="submit" value="Enviar">
            </p>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Meu Site Pessoal</p>
    </footer>
</body>
</html>
